- type: entity
  parent: BaseComputerAiAccess
  id: ComputerBotanicalSeedDnaManipulator
  name: botanical DNA analyzer
  description: Shows approximate seed traits and chemical concentrations. It cannot copy or rewrite genes.
  components:
  - type: SeedDnaConsole
    seedSlot:
      name: seed-dna-slot-component-slot-name-seeds
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      swap: true
      whitelist:
        components:
        - Seed
    dnaDiskSlot:
      name: seed-dna-slot-component-slot-name-disk
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      swap: true
      insertOnInteract: false
      whitelist:
        tags: []
  - type: ActivatableUI
    key: enum.SeedDnaConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SeedDnaConsoleUiKey.Key:
        type: SeedDnaConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: id_key_off
    - map: ["computerLayerScreen"]
      state: dna
    - map: ["computerLayerKeys"]
      state: id_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: Computer
    board: BotanicalSeedDnaManipulatorCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#3c5eb5"
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      board: !type:Container
      SeedSlotId: !type:ContainerSlot
      DnaDiskSlotId: !type:ContainerSlot
