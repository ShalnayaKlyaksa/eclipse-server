# Pages of the in-game imitation of the station's public site (the "САЙТ" section of the lobby).
# This is flavour only — there is no real site. Add a page here and it appears in the site's navigation.
#
# newsFeed: true — the page renders the live news feed from news.yml instead of its own sections.
# order:    position in the navigation column, lower is higher up.

- type: eclipseSitePage
  id: EclipseSiteNews
  order: 0
  title: Новости
  subtitle: Сводка событий
  newsFeed: true

- type: eclipseSitePage
  id: EclipseSiteAbout
  order: 1
  title: О станции
  subtitle: Общая информация
  sections:
  - heading: Назначение
    body: >-
      Станция Eclipse — исследовательский и перевалочный узел на границе освоенного пространства.
      Основные направления работы: научные программы, обслуживание транзитных судов и добыча ресурсов
      в ближайших поясах.
  - heading: Экипаж
    body: >-
      Постоянный состав включает инженерную, медицинскую, научную службы, службу снабжения и охрану.
      Приём новых сотрудников ведётся непрерывно, вахты сменяются по внутреннему расписанию.
  - heading: Юрисдикция
    body: >-
      Станция подчиняется Эйдосской империи. Внутренний распорядок устанавливается командованием станции,
      спорные вопросы разрешаются представителем командования.

- type: eclipseSitePage
  id: EclipseSiteDepartments
  order: 2
  title: Отделы
  subtitle: Кто чем занят
  sections:
  - heading: Инженерный отдел
    body: >-
      Отвечает за энергоснабжение, атмосферу и целостность корпуса. Инженеры имеют доступ в технические
      туннели и к распределительным узлам.
  - heading: Медицинская служба
    body: >-
      Оказывает помощь экипажу, ведёт карантинные протоколы и запас медикаментов. При тяжёлых травмах
      обращаться напрямую в медотсек, не дожидаясь смены.
  - heading: Служба безопасности
    body: >-
      Поддерживает порядок, контролирует стыковку судов и оборот запрещённых предметов.
      Задержания оформляются с обязательной регистрацией.
  - heading: Снабжение
    body: >-
      Принимает и распределяет грузы, оформляет заказы отделов и работает с транзитными конвоями.

- type: eclipseSitePage
  id: EclipseSiteVisitors
  order: 3
  title: Посетителям
  subtitle: Правила пребывания
  sections:
  - heading: Прибытие
    body: >-
      Частные суда принимаются на внешние причалы по предварительной заявке. Груз декларируется
      до стыковки. Оружие сдаётся на хранение службе безопасности.
  - heading: Передвижение
    body: >-
      Доступ в служебные отсеки без сопровождения запрещён. Аварийные секторы закрываются автоматикой,
      пересекать ограждения нельзя даже при отсутствии видимой опасности.
  - heading: Связь
    body: >-
      Вопросы и жалобы направляются командованию станции. При чрезвычайной ситуации следуйте указаниям
      служебных объявлений и не блокируйте эвакуационные коридоры.
