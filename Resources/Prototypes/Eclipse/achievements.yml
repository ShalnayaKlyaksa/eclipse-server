# Account achievements shown on the lobby "Аккаунт" tab.
# Progress is computed on the client from playtime trackers and account level, so no server backend is needed.
#
# kind:
#   Playtime     — total playtime, goal in hours
#   Level        — account level, goal is the level
#   RolePlaytime — playtime in `tracker`, goal in hours
#   RoleVariety  — number of distinct roles played 1+ hour, goal is the count

- type: eclipseAchievement
  id: EclipseAchFirstShift
  order: 0
  name: Первая смена
  description: Отыграйте свой первый час на станции.
  kind: Playtime
  goal: 1
  icon: /Textures/Interface/VerbIcons/clock.svg.192dpi.png

- type: eclipseAchievement
  id: EclipseAchVeteran
  order: 1
  name: Ветеран станции
  description: Наберите 50 часов общего игрового времени.
  kind: Playtime
  goal: 50
  icon: /Textures/Interface/examine-star.png

- type: eclipseAchievement
