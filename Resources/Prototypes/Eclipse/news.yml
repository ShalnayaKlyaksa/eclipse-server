  order: 0
  date: 05.08.2567
  title: Исследовательская станция «Прометей» развёрнута
  badge: Important
  featured: true
  source: Пресс-служба Эйдосской империи
  summary: Эйдосская империя развернула свою первую исследовательскую станцию и уже направила туда первую рабочую группу.
  text: >-
    Эйдосская империя официально объявила о завершении развёртывания своей первой исследовательской станции — «Прометей».
    К объекту уже выслана первая группа специалистов. Им предстоит подготовить станционные комплексы к полноценной работе,
    запустить первые исследовательские программы и обеспечить дальнейшее освоение станции.
    Открытие «Прометея» знаменует начало нового этапа научного развития и расширения присутствия Эйдосской империи.
  texture: /Textures/Eclipse/MainMenu/news/news-tech.png

- type: eclipseNews
  id: EclipseNewsImperialElection
  order: 1
  date: 05.08.2567
  title: Эйдосская империя готовится к выборам
  badge: Important
  featured: true
  source: Имперская избирательная комиссия
  summary: В скором времени состоятся выборы нового императора или императрицы Эйдосской империи.
  text: >-
    Имперская избирательная комиссия объявляет о скором проведении выборов нового императора или императрицы Эйдосской империи.
    Подданным предстоит определить, кому будет доверено будущее государства и его народа.
    Следите за выступлениями кандидатов, знакомьтесь с их программами и отдайте свой голос за того,
    кто полюбится вам и окажется достоин возглавить Империю.
  texture: /Textures/Eclipse/MainMenu/news/news-event.png
