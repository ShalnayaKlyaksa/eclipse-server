- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: PhotocopierBase
  name: копировальный аппарат
  description: ЭИ закупило их чтобы сэкономить на ручках для юридического отдела.
  suffix: Стандартный
  components:
  - type: Sprite
    sprite: _DeadSpace/Structures/Machines/photocopier.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
      map: [ "enum.PhotocopierVisuals.VisualState" ]
  - type: Transform #Backmen-edit
    noRot: false
  - type: Icon
    sprite: _DeadSpace/Structures/Machines/photocopier.rsi
    state: icon
  - type: Appearance
  - type: Machine
    board: PrinterDocMachineCircuitboard
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.10,0.15,0.50"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: ActivatableUI
    key: enum.PhotocopierUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.PhotocopierUiKey.Key:
        type: PhotocopierBoundUi
  - type: Photocopier
    paperSlot:
      ejectSound: /Audio/Machines/tray_eject.ogg
      whitelist:
        components:
          - Paper
    photocopierType: Default
  - type: GenericVisualizer
    visuals:
      enum.PhotocopierVisuals.VisualState:
        base:
          Normal: { state: icon }
          Scanning: { state: scanning }
          Printing: { state: printing }
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      Paper: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container

- type: entity
  parent: PhotocopierBase
  id: PhotocopierCommand
  name: копировальный аппарат командования
  description: ЭИ закупило их чтобы сэкономить на ручках для юридического отдела.
  suffix: Командование

  components:
  - type: Photocopier
    paperSlot:
      ejectSound: /Audio/Machines/tray_eject.ogg
      whitelist:
        components:
          - Paper
    photocopierType: Command

- type: entity
  parent: PhotocopierBase
  id: PhotocopierCentcomm
  name: копировальный аппарат Эйдосской империи
  description: От этого копировального аппарата веет понижением зарплаты станции.
  suffix: Эйдосская империя

  components:
  - type: Photocopier
    paperSlot:
      ejectSound: /Audio/Machines/tray_eject.ogg
