- type: entity
  parent: FoodInjectableBase
  id: EclipseFoodCucumber
  name: cucumber
  description: A culinary ingredient. Processing changes its properties.
  components:
  - type: Sprite
    sprite: _Eclipse/Objects/Consumable/Food/culinary_produce.rsi
    state: cucumber
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
  - type: Extractable
    grindableSolutionName: food
