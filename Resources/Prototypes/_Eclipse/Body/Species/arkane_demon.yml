# Arkane are human-shaped demonic xenos with horns and a devil-like tail.
# Their external body uses the existing Eclipse demon sprites, while their anatomy stays human-compatible.

- type: markingsGroup
  parent: Undergarments
  id: Arkane
  limits:
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ DemonHornsSmall ]
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ TailDemon ]
    enum.HumanoidVisualLayers.Overlay:
      limit: 1
      required: true
      default: [ ArkaneWings ]
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false

- type: entity
  parent: OrganHumanExternal
  id: OrganArkaneExternal
  abstract: true
  suffix: arkane
  components:
  - type: Sprite
    sprite: Eclipse/Mobs/Demon/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Eclipse/Mobs/Demon/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Arkane

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganArkaneExternal ]
  id: OrganArkaneTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganArkaneExternal ]
  id: OrganArkaneHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout

- type: entity
  parent: [ OrganBaseArmLeft, OrganArkaneExternal ]
  id: OrganArkaneArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganArkaneExternal ]
  id: OrganArkaneArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganArkaneExternal ]
  id: OrganArkaneHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganArkaneExternal ]
  id: OrganArkaneHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganArkaneExternal ]
  id: OrganArkaneLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganArkaneExternal ]
  id: OrganArkaneLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganArkaneExternal ]
  id: OrganArkaneFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganArkaneExternal ]
  id: OrganArkaneFootRight

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceArkane
  categories: [ HideSpawnMenu ]
  name: arkane appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganArkaneTorso
      Head: OrganArkaneHead
      ArmLeft: OrganArkaneArmLeft
      ArmRight: OrganArkaneArmRight
      HandRight: OrganArkaneHandRight
      HandLeft: OrganArkaneHandLeft
      LegLeft: OrganArkaneLegLeft
      LegRight: OrganArkaneLegRight
      FootLeft: OrganArkaneFootLeft
      FootRight: OrganArkaneFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Arkane

- type: entity
  parent: [ AppearanceArkane, BaseSpeciesMobOrganic ]
  id: MobArkane
  name: Urist McArkane
  components:
  - type: JumpAbility
    action: ActionArkaneWingHop
    jumpDistance: 4.5
    groundJumpDistanceMultiplier: 1.25

- type: marking
  id: ArkaneWings
  bodyPart: Overlay
  groupWhitelist: [ Arkane ]
  sprites:
  - sprite: _Orion/Mobs/Customization/Anthropomorph/wings.rsi
    state: insect_wings_dragonalt
