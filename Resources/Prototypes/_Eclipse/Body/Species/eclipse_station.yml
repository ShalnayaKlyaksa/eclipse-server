- type: entity
  parent: AppearanceHuman
  id: AppearanceLavrite
  categories: [ HideSpawnMenu ]
  name: lavrite appearance
  components:
  - type: HumanoidProfile
    species: Lavrite
  - type: InitialBody
    organs:
      Torso: OrganLavriteTorso
      Head: OrganHumanHead
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandRight: OrganHumanHandRight
      HandLeft: OrganHumanHandLeft
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys

- type: entity
  parent: OrganHumanTorso
  id: OrganLavriteTorso
  components:
  - type: VisualOrganMarkings
    markingData:
      group: Lavrite

- type: markingsGroup
  parent: Human
  id: Lavrite
  limits:
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      onlyGroupWhitelisted: true
      default: [ LavriteTailFlame ]

- type: entity
  parent: [ AppearanceLavrite, BaseSpeciesMobOrganic ]
  id: MobLavrite
  name: Urist McLavrite
  components:
  - type: Temperature
    currentTemperature: 323.15
  - type: ThermalRegulator
    normalBodyTemperature: 323.15
    metabolismHeat: 1150
    radiatedHeat: 220
  - type: TemperatureDamage
    heatDamageThreshold: 380
    coldDamageThreshold: 285
    coldDamage:
      types:
        Cold: 0.22
  - type: TemperatureSpeed
    thresholds:
      303: 0.9
      294: 0.75
      285: 0.6
  - type: LavriteHeat
  - type: ActionGrant
    actions: [ ActionLavriteVentHeat, ActionLavriteCoolTouch ]

