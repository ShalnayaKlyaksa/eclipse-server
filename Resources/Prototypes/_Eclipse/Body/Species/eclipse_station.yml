    breathableGases: [ Oxygen, Nitrogen, CarbonDioxide, Plasma, WaterVapor, Ammonia, NitrousOxide ]

- type: entity
  parent: [ AppearanceSlimefolk, BaseSpeciesMobOrganic ]
  id: MobSlimefolk
  name: Urist McSlimefolk
  components:
  - type: Damageable
    damageModifierSet: EclipseSlimefolk
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Slime
        Quantity: 300
  - type: Speech
    speechSounds: Slime
    speechVerb: Slime
    allowedEmotes: [ Squish ]
  - type: Vocal
    sounds:
      Male: MaleSlime
      Female: FemaleSlime
      Unsexed: MaleSlime
  - type: ActionGrant
    actions: [ ActionSlimeReform, ActionSlimeAdhesive ]

- type: damageModifierSet
  id: EclipseSlimefolk
  coefficients:
    Blunt: 0.6
    Piercing: 0.8
    Heat: 1.4
    Cold: 1.4
