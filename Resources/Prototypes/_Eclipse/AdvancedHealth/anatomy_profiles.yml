# Anatomy profile IDs intentionally match SpeciesPrototype IDs.
# Blood and plasma settings here are consumed by AdvancedHealth on spawn.

- type: advancedHealthAnatomy
  id: Human

- type: advancedHealthAnatomy
  id: Imperial
  bodyFluid: Blood
  fluidColor: "#c60000"
  bloodTypes: [ "O-", "O+", "A-", "A+", "B-", "B+", "AB-", "AB+" ]
  incompatibleTransfusionPopup: advanced-health-transfusion-incompatible-imperial

