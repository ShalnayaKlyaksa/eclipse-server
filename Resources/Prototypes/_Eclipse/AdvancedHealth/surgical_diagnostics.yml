- type: entity
  parent: Scalpel
  id: AdvancedSterileScalpel
  name: surgical scalpel
  components:
  - type: Sprite
    sprite: _Eclipse/Objects/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: Item
    sprite: _Eclipse/Objects/Medical/Surgery/scalpel.rsi
    heldPrefix: null

- type: entity
  parent: Hemostat
  id: AdvancedSterileHemostat
  name: vascular hemostat
  components:
  - type: Sprite
    sprite: _Eclipse/Objects/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: Item
    sprite: _Eclipse/Objects/Medical/Surgery/hemostat.rsi
    heldPrefix: null

- type: entity
  parent: BaseItem
  id: AdvancedInstrumentSterilizationKit
  name: sterile instrument reprocessing pack
  description: Apply to a contaminated surgical instrument. Contains a single-use cleaning agent and sterile wrap.
  components:
  - type: Sprite
    sprite: _Eclipse/Objects/Medical/Surgery/drapes.rsi
    state: drapes
  - type: Item
    sprite: _Eclipse/Objects/Medical/Surgery/drapes.rsi
    size: Small
  - type: InstrumentSterilization
    delay: 5

- type: entity
  parent: BaseMachinePowered
  id: AdvancedClinicalBloodAnalyzer
  name: stationary blood analyzer
  description: Use a labeled blood tube on the powered analyzer to print a laboratory report.
  components:
  - type: Sprite
    sprite: Structures/Machines/mixer.rsi
    layers:
    - state: mixer_empty
      color: "#b4d7ec"
    - state: mixer_screens
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: ClinicalBloodAnalyzer

- type: entity
  parent: BaseFlatpack
  id: AdvancedClinicalBloodAnalyzerFlatpack
  name: blood analyzer flatpack
  components:
  - type: Flatpack
    entity: AdvancedClinicalBloodAnalyzer

- type: entity
  parent: AdvancedMedicalImager
  id: AdvancedElectrocardiograph
  name: portable electrocardiograph
  description: Records the heart rate in the chest region. Compares it with the patient's baseline.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/healthanalyzer.rsi
    state: icon
    color: "#a2d4b2"
  - type: AdvancedTreatment
    treatment: Electrocardiogram
    delay: 5
    reusable: true
