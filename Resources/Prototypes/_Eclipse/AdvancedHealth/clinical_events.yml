- type: entity
  parent: BaseStationEventShortDelay
  id: ClinicalIllnessIncident
  components:
  - type: StationEvent
    weight: 2
    earliestStart: 25
    reoccurrenceDelay: 45
    minimumPlayers: 2
    duration: 1
  - type: ClinicalOutbreak

- type: entity
  parent: MobHuman
  id: MobHumanClinicalPatient
  suffix: Clinical patient
  components:
  - type: AdvancedDisease
    active:
      SpaceFlu: 0
    severity:
      SpaceFlu: 0.3

- type: entity
  parent: ClinicalIllnessIncident
  id: ClinicalEmergencyIncident
  components:
  - type: StationEvent
    weight: 1
    minimumPlayers: 15
    earliestStart: 30
    reoccurrenceDelay: 45
  - type: ClinicalOutbreak
    conditions: [ ClinicalBronchospasm, ClinicalAppendicitis, ClinicalAnaphylaxis ]
