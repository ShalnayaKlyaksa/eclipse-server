- type: entity
  abstract: true
  parent: ChemistryEmptyVial
  id: AdvancedMedicineVialBase
  name: medicine vial
  description: A labelled 30-unit medicine vial. Draw the solution with a syringe.

- type: entity
  parent: AdvancedMedicineVialBase
  id: AdvancedMedicineVialInaprovaline
  name: Inaprovaline vial
  components:
  - type: Label
    currentLabel: reagent-name-inaprovaline
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: Inaprovaline
          Quantity: 30

