- type: entity
  parent: EclipseFoodHoneycomb
  id: GardenLilyHoneycomb
  name: lily honeycomb
  components:
  - type: Sprite
    color: '#F3DFAD'
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 8
        reagents:
        - ReagentId: EclipseLilyHoney
          Quantity: 8

- type: reagent
  id: EclipseLilyHoney
  parent: EclipseHoney
  name: reagent-name-eclipse-lily-honey
  desc: reagent-desc-eclipse-lily-honey
  color: '#F3DFAD'

- type: culinaryIngredient
  id: CulinaryEclipseLilyHoney
  foods: [GardenLilyHoneycomb]
  reagents: [EclipseLilyHoney]
  traits:
    Calm: 3
    Hydration: 2
    Stability: 1

- type: reagent
  id: LilyHoneyLemonade
  parent: BaseDrink
  name: reagent-name-lilyhoneylemonade
  desc: reagent-desc-lilyhoneylemonade
  physicalDesc: reagent-physical-desc-aromatic
  flavor: sweet
  color: '#F3DFAD'
  recognizable: true

- type: reaction
  id: LilyHoneyLemonade
  requiredMixerCategories:
  - Stir
  reactants:
    EclipseLilyHoney:
      amount: 1
    JuiceLemon:
      amount: 1
    SodaWater:
      amount: 2
  products:
    LilyHoneyLemonade: 4

- type: entity
