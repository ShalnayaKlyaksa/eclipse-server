- type: entity
  parent: [BaseMachinePowered, SmallConstructibleMachine]
  id: EclipseApiary
  name: apiary
  components:
  - type: Sprite
    sprite: _Eclipse/Beekeeping/equipment.rsi
    state: hive
  - type: Apiary
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 0
  - type: Machine
    board: EclipseApiaryCircuitboard
  - type: ActivatableUI
    key: enum.ApiaryUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ApiaryUiKey.Key:
        type: ApiaryBoundUserInterface
  - type: ContainerContainer
    containers:
      apiary-input: !type:Container
      apiary-output: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers: [apiary-input, apiary-output]
  - type: GuideHelp
    guides: [EclipseBeekeeping]

- type: entity
  parent: EclipseApiary
  id: EclipseAdvancedApiary
  name: climate-controlled apiary
  components:
  - type: Apiary
    controlledClimate: true
  - type: Sprite
    state: hive-advanced
  - type: ApcPowerReceiver
    needsPower: true
    powerLoad: 500
  - type: Machine
    board: EclipseAdvancedApiaryCircuitboard

- type: entity
  parent: BaseMachineCircuitboard
  id: EclipseApiaryCircuitboard
  name: apiary machine board
  components:
  - type: MachineBoard
    prototype: EclipseApiary
    stackRequirements:
      WoodPlank: 8
      Steel: 2

- type: entity
  parent: BaseMachineCircuitboard
  id: EclipseAdvancedApiaryCircuitboard
  name: climate-controlled apiary machine board
  components:
  - type: MachineBoard
    prototype: EclipseAdvancedApiary
    stackRequirements:
      Steel: 8
      Glass: 4
      Cable: 5

- type: entity
