- type: reagent
  id: EclipseHoney
  name: reagent-name-eclipse-honey
  desc: reagent-desc-eclipse-honey
  physicalDesc: reagent-physical-desc-sticky
  group: Foods
  flavor: sweet
  color: "#D49E32"
  metabolisms:
    Metabolites:
      effects:
      - !type:SatiateHunger

- type: culinaryIngredient
  id: EclipseCulinaryHerbalHoneycomb
  foods: [EclipseFoodHerbalHoneycomb]
  traits: {Calm: 2, Cooling: 1, Stability: 3}

- type: culinaryIngredient
  id: EclipseCulinaryEnergeticHoneycomb
  foods: [EclipseFoodEnergeticHoneycomb]
  traits: {Recovery: 2, Efficiency: 2, Rapid: 2}

- type: culinaryIngredient
  id: EclipseCulinaryRoyalHoneycomb
  foods: [EclipseFoodRoyalHoneycomb]
  traits: {Healing: 1, Calm: 2, Stability: 3}

- type: culinaryIngredient
  id: EclipseCulinaryHoney
  reagents: [EclipseHoney]
  traits: {Rapid: 2, Stability: 3, Stimulation: 1}

- type: guideEntry
  id: EclipseBeekeeping
