# Temporary in-project artwork. External reactor candidates have not been approved.
- type: entity
  abstract: true
  id: BaseNuclearSection
  parent: BaseMachine
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: false
  - type: Pullable
  - type: Sprite
    sprite: Structures/Power/Generation/ame.rsi
    state: shield_0
  - type: Icon
    sprite: Structures/Power/Generation/ame.rsi
    state: shield_0
  - type: GuideHelp
    guides: [EclipseNuclearReactor]

- type: entity
  id: NuclearReactorCore
  parent: BaseNuclearSection
  name: reactor instrumentation spine
  description: The central instrumentation spine of a seven-by-seven graphite reactor. It produces heat, not electricity.
  components:
  - type: NuclearReactor
  - type: Explosive
    explosionType: Default
  - type: RadiationSource
    intensity: 0
    slope: 0.3
  - type: Sprite
    state: core
  - type: Icon
    state: core

- type: entity
  id: NuclearReactorShield
  parent: BaseNuclearSection
  name: reactor biological shield section
  description: A bolted section of the reactor's outer shield.
  components:
  - type: NuclearReactorPart
    kind: Shield
  - type: RadiationBlocker
    resistance: 5

- type: entity
  id: NuclearReactorCorium
  name: molten reactor debris
  description: Radioactive remains of a destroyed core. The heat did not disappear with the reactor.
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    sprite: Structures/Power/Generation/ame.rsi
    state: core
    color: '#C39265'
  - type: NuclearCorium
  - type: RadiationSource
    intensity: 4
    slope: 0.3
  - type: AlwaysHot

- type: entity
  id: NuclearReactorFuelChannel
  parent: BaseNuclearSection
  name: sealed reactor fuel channel
  description: A sealed fuel assembly and its pressure channel. Replace only after shutdown and cooldown.
  components:
  - type: NuclearReactorPart
    kind: Fuel
  - type: Sprite
    sprite: Structures/Power/Generation/rtg.rsi
    state: rtg
  - type: Icon
    sprite: Structures/Power/Generation/rtg.rsi
    state: rtg

- type: entity
  id: NuclearReactorGraphite
  parent: BaseNuclearSection
  name: reactor graphite moderator block
  description: Slows neutrons in the active zone. This is not a control rod.
  components:
  - type: NuclearReactorPart
    kind: Graphite
  - type: Sprite
    color: '#777E83'

- type: entity
  id: NuclearReactorControlChannel
  parent: BaseNuclearSection
  name: reactor control rod drive
  description: A neutron absorber with a powered positioning drive and a gravity-assisted emergency drop.
  components:
  - type: NuclearReactorPart
    kind: Control
  - type: Sprite
    sprite: Structures/Power/Generation/teg.rsi
    state: circ-0
  - type: Icon
    sprite: Structures/Power/Generation/teg.rsi
    state: circ-0

- type: entity
  id: NuclearReactorInlet
  parent: BaseNuclearSection
  name: reactor coolant inlet header
  description: The western coolant inlet. Connect a separate pumped primary loop outside the reactor.
  components:
  - type: NuclearReactorPart
    kind: Inlet
  - type: RadiationBlocker
    resistance: 5
  - type: NodeContainer
    examinable: true
    nodes:
      coolant:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: West
        volume: 1000
  - type: AtmosUnsafeUnanchor
  - type: Sprite
    sprite: Structures/Power/Generation/teg.rsi
    state: circ-0
  - type: Icon
    sprite: Structures/Power/Generation/teg.rsi
    state: circ-0

- type: entity
  id: NuclearReactorOutlet
  parent: NuclearReactorInlet
  name: reactor coolant outlet header
  description: The eastern hot coolant outlet. Heat must be removed before returning coolant to the inlet.
  components:
  - type: NuclearReactorPart
    kind: Outlet
  - type: RadiationBlocker
    resistance: 5
  - type: NodeContainer
    nodes:
      coolant:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: East
        volume: 1000

- type: entity
  id: NuclearReactorConsole
  parent: BaseNuclearSection
  name: reactor control station
  description: The northern control station of a seven-by-seven reactor. Requires independent auxiliary power.
  components:
  - type: NuclearReactorPart
    kind: Console
  - type: RadiationBlocker
    resistance: 5
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    state: computer
  - type: Icon
    sprite: Structures/Machines/computers.rsi
    state: computer
  - type: ApcPowerReceiver
    powerLoad: 5000
  - type: ExtensionCableReceiver
  - type: ActivatableUI
    key: enum.NuclearReactorUiKey.Key
    requiresPower: false
  - type: UserInterface
    interfaces:
      enum.NuclearReactorUiKey.Key:
        type: NuclearReactorBoundUserInterface

- type: guideEntry
  id: EclipseNuclearReactor
  name: guide-entry-eclipse-nuclear-reactor
  text: /ServerInfo/Guidebook/Engineering/Industrial/NuclearReactor.xml
  priority: 12

- type: entity
  id: NuclearReactorCoreFlatpack
  parent: BaseFlatpack
  name: reactor core section flatpack
  components:
  - type: Flatpack
    entity: NuclearReactorCore
    qualityNeeded: Anchoring
  - type: GuideHelp
    guides: [EclipseNuclearReactor]

- type: entity
  id: NuclearReactorShieldFlatpack
  parent: BaseFlatpack
  name: reactor shield section flatpack
  components:
  - type: Flatpack
