  - type: GuideHelp
    guides: [EclipseNuclearReactor]

- type: entity
  id: NuclearReactorControlChannelFlatpack
  parent: BaseFlatpack
  name: reactor controlchannel section flatpack
  components:
  - type: Flatpack
    entity: NuclearReactorControlChannel
    qualityNeeded: Anchoring
  - type: GuideHelp
    guides: [EclipseNuclearReactor]

- type: entity
  id: NuclearReactorInletFlatpack
  parent: BaseFlatpack
  name: reactor inlet section flatpack
  components:
  - type: Flatpack
    entity: NuclearReactorInlet
    qualityNeeded: Anchoring
  - type: GuideHelp
    guides: [EclipseNuclearReactor]

- type: entity
  id: NuclearReactorOutletFlatpack
  parent: BaseFlatpack
  name: reactor outlet section flatpack
  components:
  - type: Flatpack
    entity: NuclearReactorOutlet
    qualityNeeded: Anchoring
  - type: GuideHelp
