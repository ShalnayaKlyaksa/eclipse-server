  - type: GuideHelp
    guides: [EclipseNuclearReactor]

- type: entity
  id: NuclearReactorGraphiteFlatpack
  parent: BaseFlatpack
  name: reactor graphite section flatpack
  components:
  - type: Flatpack
    entity: NuclearReactorGraphite
