  components:
  - type: Stack
    count: 1

- type: industrialRecipe
  id: IndustrialFormCopperSheets
  processor: Assembler
  time: 4
  inputs:
    IngotCopper: 1
  outputs:
    SheetCopper1: 1

- type: industrialRecipe
  id: IndustrialRemeltCopperSheets
  processor: Smelter
  time: 5
  inputs:
    SheetCopper: 1
  outputs:
    IngotCopper1: 1

- type: industrialFabricationRecipe
  id: FabricateCopperSheets
  name: industrial-fabrication-copper-sheets
  result: SheetCopper1
  duration: 8
  ingredients:
    IngotCopper: 1
