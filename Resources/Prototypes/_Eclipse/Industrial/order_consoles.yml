# Shared station production queue; consoles do not manufacture items or spend research points.
- type: entity
  parent: BaseComputer
  id: ComputerFabricationDispatcher
  name: fabrication orders terminal
  components:
  - type: Sprite
    layers:
    - state: computer
      map: ["computerLayerBody"]
    - state: generic_keyboard
      map: ["computerLayerKeyboard"]
    - state: request-eng
      map: ["computerLayerScreen"]
    - state: generic_keys
      map: ["computerLayerKeys"]
    - state: generic_panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: FabricationOrderConsole
    dispatcher: true
    department: Engineering
  - type: ActivatableUI
    key: enum.FabricationOrderUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FabricationOrderUiKey.Key:
        type: FabricationOrderBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: AccessReader
    access: [["Engineering"], ["Command"]]
  - type: Computer
    board: FabricationDispatcherCircuitboard
  - type: PointLight
    color: '#B8A782'
    radius: 1.2
    energy: 1.6

- type: entity
  parent: BaseComputerCircuitboard
  id: FabricationDispatcherCircuitboard
  name: fabrication terminal board
  components:
  - type: Sprite
    state: cpu_engineering
  - type: ComputerBoard
    prototype: ComputerFabricationDispatcher
  - type: PhysicalComposition
    materialComposition:
      Glass: 200
      Steel: 200
      Copper: 100

- type: industrialFabricationRecipe
  id: FabricateFabricationDispatcherCircuitboard
  result: FabricationDispatcherCircuitboard
  duration: 12
  ingredients:
    SheetGlass1: 2
    SheetSteel1: 2
    IngotCopper1: 1

