- type: entity
  abstract: true
  parent: WaterTank
  id: BaseIndustrialReagentTank
  description: Wrench the tank to the floor and connect a liquid pipe to its east side.
  components:
  - type: Anchorable
  - type: LiquidPipeEndpoint
    inputFace: Invalid
    outputFace: East
    outputSolution: tank
    hasOutput: true
  - type: ExaminableSolution
    exactVolume: true
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 250
        canReact: false

- type: entity
  parent: BaseIndustrialReagentTank
  id: IndustrialReagentTankWater
  name: industrial water tank
  components:
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 1500
        reagents:
        - ReagentId: Water
          Quantity: 1500

