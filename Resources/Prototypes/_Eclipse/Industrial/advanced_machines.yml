# Advanced industrial production. Basic station supply keeps its existing recipes.
- type: entity
  abstract: true
  parent: IndustrialTierIndustrialProcessor
  id: BaseIndustrialFluidProcessor
  components:
  - type: IndustrialFluidProcessor
  - type: UserInterface
    interfaces:
      enum.IndustrialProcessorUiKey.Key:
        type: IndustrialProcessorBoundUserInterface
      enum.IndustrialProcessorUiKey.Fluid:
        type: IndustrialFluidSelectionBoundUserInterface
  - type: SolutionContainerManager
    solutions:
      industrial_fluid_input:
        maxVol: 250
        canReact: false
      industrial_fluid_output:
        maxVol: 250
        canReact: false
  - type: RefillableSolution
    solution: industrial_fluid_input
  - type: DrainableSolution
    solution: industrial_fluid_output
  - type: ExaminableSolution
    solution: industrial_fluid_input
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpillBehavior
        solution: industrial_fluid_input
      - !type:SpillBehavior
        solution: industrial_fluid_output
      - !type:DoActsBehavior
        acts: [Destruction]
