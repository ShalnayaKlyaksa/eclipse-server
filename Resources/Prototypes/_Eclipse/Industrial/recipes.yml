# Ore processing chain:
# Ore -> Crusher -> Crushed ore
# Crushed ore -> Thermal Centrifuge -> Sieved ore
# Sieved ore -> Crusher -> Dust
# Dust -> Smelter -> Ingot/Sheet

# --- Iron ---
- type: industrialRecipe
  id: CrushSteelOre
  processor: Crusher
  time: 4.5
  inputs:
    SteelOre: 1
  outputs:
    CrushedIronOre: 1

- type: industrialRecipe
  id: ThermalCentrifugeCrushedIronOre
  processor: ThermalCentrifuge
  time: 6
  inputs:
    CrushedIronOre: 1
  outputs:
    SievedIronOre: 1

- type: industrialRecipe
  id: CrushSievedIronOre
  processor: Crusher
  time: 4
  inputs:
    SievedIronOre: 1
  outputs:
    IronDust: 1

- type: industrialRecipe
  id: SmeltIronDust
  processor: Smelter
  time: 8
  inputs:
    IronDust: 1
  outputs:
    SheetSteel1: 1

