# Direct smelting gives one sheet; crushing doubles the primary yield.
# Thermal separation processes two units and recovers a useful impurity.
- type: industrialRecipe
  id: CrushSteelOre
  processor: Crusher
  time: 4.5
  inputs:
    SteelOre: 1
  outputs:
    CrushedIronOre: 2
- type: industrialRecipe
  id: ThermalCentrifugeCrushedIronOre
  processor: ThermalCentrifuge
  time: 6
  inputs:
    CrushedIronOre: 2
  outputs:
    SievedIronOre: 2
    QuartzDust: 1
  heat: 250000
