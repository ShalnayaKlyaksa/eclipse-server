# Harpy parts for the Avian species.
#
# The wing/ear/tail sprites already existed in the build but had no marking prototypes, so Avians were stuck
# with the moth wings they inherit from their Moth organ group.
#
# Avians build on the anthropomorph body, so these live in the Anthropomorph marking group.
# speciesRestriction then narrows them to Avians only, so other anthropomorphs never see them.

# --- Wings -------------------------------------------------------------------------------------------------
# harpy_wings.rsi ships a plain pair plus multi-tone variants meant to be recoloured per layer.

- type: marking
  id: AvianWings
  bodyPart: Tail
  groupWhitelist: [Anthropomorph]
  speciesRestriction: [Avian]
  sprites:
  - sprite: _Backmen/Mobs/Customization/Harpy/harpy_wings.rsi
    state: harpy

