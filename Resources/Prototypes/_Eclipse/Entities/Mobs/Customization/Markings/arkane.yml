# Arkane racial features, ported from the Shadowkin markings in space-erida-14 (_Backmen).
# The sprites already shipped in this build under _Eclipse/Mobs/Customization/Shadowkin, they just had no
# marking prototypes, so Arkanes had no racial features at all.
#
# Arkanes build on the human body, so these live in the Human marking group; speciesRestriction then narrows
# them to Arkanes so ordinary humans never see them.

- type: marking
  id: BodyShadowkinArrow
  bodyPart: LLeg
  groupWhitelist: [Human]
  speciesRestriction: [Arkane]
  sprites:
    - sprite: _Eclipse/Mobs/Customization/Shadowkin/shadowkin_overlay.rsi
