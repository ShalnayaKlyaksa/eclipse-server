- type: entity
  parent: IndustrialTierIndustrialProcessor
  id: IndustrialBuffer
  name: industrial resource storage
  description: Stores materials and parts for a production line. Configure item input and output ports to connect it to the line.
  components:
  - type: IndustrialProcessor
    processorType: Buffer
    inputContainerId: industrial_input
    outputContainerId: industrial_input
    maxInputSlots: 32
    maxOutputSlots: 32
    canWorkWithoutPower: true
    autoStart: false
  - type: ApcPowerReceiver
    powerLoad: 0
  - type: Sprite
    sprite: _Eclipse/Structures/Machines/industrial_buffer.rsi
    layers:
    - state: icon
      map: ["enum.IndustrialProcessorVisualLayers.Base"]
  - type: Icon
    sprite: _Eclipse/Structures/Machines/industrial_buffer.rsi
    state: icon
