- type: entity
  abstract: true
  parent: BaseIndustrialProcessor
  id: BaseIndustrialAssembler
  description: Automatically assembles physical components into finished products. Select a recipe to dedicate a production line.
  components:
  - type: IndustrialProcessor
    processorType: Assembler
  - type: ApcPowerReceiver
    powerLoad: 3000
  - type: AccessReader
    access: [["Engineering"]]
  - type: ActivatableUIRequiresAccess
  - type: TechnologyDatabase
  - type: ResearchClient
  - type: UserInterface
    interfaces:
      enum.IndustrialProcessorUiKey.Key:
        type: IndustrialProcessorBoundUserInterface
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface

  - type: Sprite
    sprite: _Eclipse/Structures/Machines/industrial_assembler.rsi
    layers:
    - state: icon
      map: ["enum.IndustrialProcessorVisualLayers.Base"]
  - type: Icon
    sprite: _Eclipse/Structures/Machines/industrial_assembler.rsi
    state: icon

