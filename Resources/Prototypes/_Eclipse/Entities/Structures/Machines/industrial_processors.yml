- type: entity
  abstract: true
  parent: BaseMachinePowered
  id: BaseIndustrialProcessor
  description: Industrial ore processing equipment.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.6,0.6,0.6"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Pullable
  - type: RoomSanitation
  - type: IndustrialMachineKnowledge
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.IndustrialProcessorVisuals.State:
        enum.IndustrialProcessorVisualLayers.Base:
          Idle: { state: icon }
          Working: { state: building }
          Blocked: { state: icon }
          Unpowered: { state: icon }
          Unheated: { state: icon }
          Paused: { state: paused }
          Unresearched: { state: icon }
  - type: IndustrialProcessor
    inputContainerId: industrial_input
    outputContainerId: industrial_output
    autoStart: true
    canWorkWithoutPower: false
  - type: ContainerContainer
    containers:
      industrial_input: !type:Container
      industrial_output: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers:
    - industrial_input
    - industrial_output
  - type: GuideHelp
    guides:
    - EclipseIndustrial
    - Salvage
  - type: InteractionOutline
  - type: ActivatableUI
    key: enum.IndustrialProcessorUiKey.Key
    requireActiveHand: false
  - type: UserInterface
    interfaces:
      enum.IndustrialProcessorUiKey.Key:
        type: IndustrialProcessorBoundUserInterface

  - type: Sprite
    sprite: _Eclipse/Structures/Machines/industrial_crusher.rsi
    layers:
    - state: icon
      map: ["enum.IndustrialProcessorVisualLayers.Base"]
  - type: Icon
    sprite: _Eclipse/Structures/Machines/industrial_crusher.rsi
    state: icon

- type: entity
  abstract: true
  id: IndustrialSmelterVisuals
  components:
  - type: GenericVisualizer
    visuals:
      enum.IndustrialProcessorVisuals.State:
        enum.IndustrialProcessorVisualLayers.Base:
          Idle: { state: paused }
          Working: { state: power_on }
          Blocked: { state: paused }
          Unpowered: { state: paused }
          Unheated: { state: paused }
          Paused: { state: paused }
          Unresearched: { state: paused }

- type: entity
  abstract: true
  id: IndustrialCrusherVisuals
  components:
  - type: IndustrialCrusherVisuals
  - type: GenericVisualizer
    visuals:
      enum.IndustrialProcessorVisuals.State:
        enum.IndustrialProcessorVisualLayers.Base:
          Idle: { state: paused }
          Working: { state: power_on }
          Blocked: { state: paused }
          Unpowered: { state: paused }
          Unheated: { state: paused }
          Paused: { state: paused }
          Unresearched: { state: paused }

- type: entity
  abstract: true
  parent: BaseIndustrialProcessor
  id: BasicTierIndustrialProcessor
  components:
  - type: IndustrialProcessor
    tier: Basic

- type: entity
  abstract: true
  parent: BaseIndustrialProcessor
  id: IndustrialTierIndustrialProcessor
  components:
  - type: IndustrialProcessor
    tier: Industrial

- type: entity
  abstract: true
  parent: BaseIndustrialProcessor
  id: PerfectTierIndustrialProcessor
  components:
  - type: IndustrialProcessor
    tier: Perfect

- type: entity
  abstract: true
  parent: BasicTierIndustrialProcessor
  id: BaseThermalCentrifugeProcessor
  components:
  - type: IndustrialProcessor
    processorType: ThermalCentrifuge
    canWorkWithoutPower: true
  - type: IndustrialHeatPowered
    minTemperature: 400
  - type: Temperature
    currentTemperature: 293.15
    specificHeat: 200

# Basic tier machines

- type: entity
  parent: [IndustrialCrusherVisuals, BasicTierIndustrialProcessor]
  id: BasicIndustrialCrusher
  name: basic industrial crusher
  description: Grinds raw ore into crushed ore, or sieved ore into dust.
  components:
  - type: IndustrialProcessor
    processorType: Crusher
  - type: ApcPowerReceiver
    powerLoad: 2000

  - type: Sprite
    sprite: _Eclipse/Structures/Machines/industrial_crusher.rsi
    layers:
    - state: paused
      map: ["enum.IndustrialProcessorVisualLayers.Base"]
  - type: Icon
    sprite: _Eclipse/Structures/Machines/industrial_crusher.rsi
    state: paused

- type: entity
  parent: BaseThermalCentrifugeProcessor
  id: BasicIndustrialThermalCentrifuge
  name: basic thermal centrifuge
  description: Separates crushed ore into sieved ore using heat. Must be warmed up to operate.
  components:
  - type: IndustrialProcessor
    tier: Basic

  - type: Sprite
    sprite: _Eclipse/Structures/Machines/industrial_centrifuge.rsi
    layers:
    - state: icon
      map: ["enum.IndustrialProcessorVisualLayers.Base"]
  - type: Icon
    sprite: _Eclipse/Structures/Machines/industrial_centrifuge.rsi
    state: icon

- type: entity
  parent: [IndustrialSmelterVisuals, BasicTierIndustrialProcessor]
  id: BasicIndustrialSmelter
  name: basic industrial smelter
  description: Smelts metal dust into ingots and sheets.
  components:
  - type: IndustrialProcessor
    processorType: Smelter
  - type: ApcPowerReceiver
    powerLoad: 5000

