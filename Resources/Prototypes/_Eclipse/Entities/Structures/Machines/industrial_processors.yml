- type: entity
  abstract: true
  parent: BasicTierIndustrialProcessor
  id: BaseThermalCentrifugeProcessor
  components:
  - type: IndustrialProcessor
    processorType: ThermalCentrifuge
    canWorkWithoutPower: true
  - type: IndustrialHeatPowered
    minTemperature: 400
  - type: Temperature
    currentTemperature: 293.15
    specificHeat: 200

# Basic tier machines

- type: entity
  parent: BasicTierIndustrialProcessor
  id: BasicIndustrialCrusher
  name: basic industrial crusher
  description: Grinds raw ore into crushed ore, or sieved ore into dust.
  components:
  - type: IndustrialProcessor
    processorType: Crusher
  - type: ApcPowerReceiver
    powerLoad: 2000
  - type: ActivatableUIRequiresPower

- type: entity
  parent: BaseThermalCentrifugeProcessor
  id: BasicIndustrialThermalCentrifuge
  name: basic thermal centrifuge
  description: Separates crushed ore into sieved ore using heat. Must be warmed up to operate.
  components:
  - type: IndustrialProcessor
    tier: Basic

- type: entity
  parent: BasicTierIndustrialProcessor
  id: BasicIndustrialSmelter
  name: basic industrial smelter
  description: Smelts metal dust into ingots and sheets.
  components:
  - type: IndustrialProcessor
    processorType: Smelter
  - type: ApcPowerReceiver
    powerLoad: 5000
  - type: ActivatableUIRequiresPower

