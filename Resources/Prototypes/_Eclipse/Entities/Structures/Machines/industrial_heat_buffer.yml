# The plasma circuit and the solid heat distribution network use separate nodes.

- type: entity
  parent: BaseMachine
  id: IndustrialHeatBuffer
  name: heat exchange buffer
  description: Exchanges heat with a plasma circuit and supplies industrial equipment through heat pipes or direct contact.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: Sprite
    sprite: _Eclipse/Structures/Machines/industrial_heat_buffer.rsi
    noRot: true
    layers:
    - state: icon
      map: ["enum.IndustrialHeatBufferVisualLayers.Light"]
    - sprite: Structures/Piping/Atmospherics/pipe.rsi
      state: pipeConnector
      rotation: 90
    - sprite: Structures/Piping/Atmospherics/pipe.rsi
      state: pipeConnector
      rotation: -90
  - type: Icon
    sprite: _Eclipse/Structures/Machines/industrial_heat_buffer.rsi
    state: icon
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.IndustrialHeatBufferVisuals.PlasmaFlowing:
        enum.IndustrialHeatBufferVisualLayers.Light:
          True: { state: building }
          False: { state: icon }
  - type: Anchorable
  - type: Pullable
  - type: AtmosDevice
  - type: AtmosPipeLayers
  - type: AtmosUnsafeUnanchor
  - type: PipeRestrictOverlap
  - type: NodeContainer
    examinable: true
    nodes:
      inlet:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: West
        volume: 100
      outlet:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: East
        volume: 100
      heat:
        !type:AdjacentNode
        nodeGroupID: IndustrialHeat
  - type: IndustrialHeatBuffer
    operatingTemperature: 1200
    minPlasmaMoles: 0.25
    heatTransferRate: 500000
  - type: Temperature
    currentTemperature: 293.15
    specificHeat: 500
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 1.5
    color: "#FF6600"
  - type: GuideHelp
    guides:
    - EclipseIndustrialPower
