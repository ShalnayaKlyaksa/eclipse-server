# Item pipes — cable-style auto-connect (16 directional sprites per tier).
# All tiers currently share the LP sprite set.

- type: entity
  abstract: true
  parent: BaseStructure
  id: WireItemPipeBase
  name: item pipe
  description: Moves items between industrial machines. Auto-connects on all sides like a cable.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
  - type: InteractionOutline
  - type: IndustrialPipingOccupant
  - type: Anchorable
    tool: IndustrialPipeDetaching
    flags: Unanchorable
    delay: 0.5
  - type: ItemPipeWireConnect
  - type: ItemPipeWireVisualizer
    statePrefix: lp
  - type: ItemPipeLayers
    numberOfPipeLayers: 3
    spriteRsiPaths:
      Primary: _Eclipse/Structures/Piping/item_lp_pipe.rsi
      Secondary: _Eclipse/Structures/Piping/item_lp_pipe.rsi
      Tertiary: _Eclipse/Structures/Piping/item_lp_pipe.rsi
    alternativePrototypes: {}
  - type: ItemPipeRestrictOverlap
  - type: Appearance
  - type: Sprite
    sprite: _Eclipse/Structures/Piping/item_lp_pipe.rsi
    state: lp0
    drawdepth: Objects
    layers:
    - state: lp0
      map: ["enum.ItemPipeVisualLayers.Hub"]
    - state: lp1
      map: ["enum.ItemPipeVisualLayers.North"]
      visible: false
    - state: lp2
      map: ["enum.ItemPipeVisualLayers.West"]
      visible: false
    - state: lp3
      map: ["enum.ItemPipeVisualLayers.South"]
      visible: false
    - state: lp4
      map: ["enum.ItemPipeVisualLayers.East"]
      visible: false
  - type: Icon
    sprite: _Eclipse/Structures/Piping/item_lp_pipe.rsi
    state: lp0
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 20

- type: entity
  parent: WireItemPipeBase
  id: LpItemPipe
  name: LP item pipe
  suffix: LP
  description: Low performance item pipe. Low throughput.
  components:
  - type: ItemPipe
    tier: Basic

- type: entity
  parent: WireItemPipeBase
  id: MpItemPipe
  name: MP item pipe
  suffix: MP
  description: Medium performance item pipe. Moderate throughput.
  components:
  - type: ItemPipe
    tier: Industrial

- type: entity
  parent: WireItemPipeBase
  id: HpItemPipe
  name: HP item pipe
  suffix: HP
  description: High performance item pipe. High throughput.
  components:
  - type: ItemPipe
    tier: Perfect
