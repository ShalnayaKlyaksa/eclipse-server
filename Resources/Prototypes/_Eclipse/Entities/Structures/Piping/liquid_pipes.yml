# Industrial liquid pipes — separate from atmos and item piping.
# Closed paired-channel sprites; contents are a flat colour square on top.

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseLiquidPipe
  name: liquid pipe
  description: Transfers solutions between adjacent sealed pipe sections.
  placement:
    mode: SnapgridCenter
  components:
  - type: Item
    size: Small
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Dynamic
    canCollide: false
  - type: Fixtures
  - type: InteractionOutline
  - type: Anchorable
    delay: 0.5
  - type: IndustrialPipingOccupant
  - type: LiquidPipe
  - type: Appearance
  - type: SolutionContainerManager
    solutions:
      pipe:
        maxVol: 20
  - type: RefillableSolution
    solution: pipe
  - type: DrainableSolution
    solution: pipe
  - type: ExaminableSolution
    solution: pipe
  - type: Sprite
    sprite: _Eclipse/Structures/Piping/liquid_pipe.rsi
    drawdepth: Objects
    layers:
    - state: pipe0
      map: ["pipe"]
    - state: content
      map: ["content"]
      color: "#2B3139"
  - type: Icon
    sprite: _Eclipse/Structures/Piping/liquid_pipe.rsi
    state: pipe12
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: pipe
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 25

- type: entity
  parent: BaseLiquidPipe
  id: BasicLiquidPipe
  name: basic liquid pipe
  description: A sealed section that transfers solutions between adjacent pipes. Low throughput.
  components:
  - type: IndustrialPipePack
    pack: BasicLiquidPipePack
  - type: LiquidPipe
    tier: Basic

- type: entity
  parent: BaseLiquidPipe
  id: IndustrialLiquidPipe
  name: industrial liquid pipe
  description: A sealed high-throughput section. Its square shows the colour of its contents.
  components:
  - type: IndustrialPipePack
    pack: IndustrialLiquidPipePack
  - type: LiquidPipe
    tier: Industrial

- type: entity
  parent: BaseLiquidPipe
  id: PerfectLiquidPipe
  name: perfect liquid pipe
  description: High-speed liquid pipe for advanced production lines.
  components:
  - type: IndustrialPipePack
    pack: PerfectLiquidPipePack
  - type: LiquidPipe
    tier: Perfect

- type: entity
  parent: BasicLiquidPipe
  id: BasicLiquidPipeRCD
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
