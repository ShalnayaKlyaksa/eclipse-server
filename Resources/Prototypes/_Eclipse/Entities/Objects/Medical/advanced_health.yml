- type: entity
  parent: BaseItem
  id: AdvancedBandage
  name: bandage roll
  description: A roll of sterile gauze. Its durability sets how much bleeding it can stop — each 1% spent in the health screen closes 0.01 L/min. Wind it around a wound in the health screen.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medical.rsi
    state: gauze
  - type: Item
    heldPrefix: gauze
    size: Small
  - type: AdvancedBandageRoll
    durability: 100
    maxDurability: 100
  - type: AdvancedTreatment
    treatment: Bandage
    effectiveness: 1
    delay: 3

