# Transfusable blood & fluid packs for the AdvancedHealth system.

- type: entity
  parent: BaseHealingItem
  id: EclipseBloodProductBase
  abstract: true
  name: blood pack
  description: A pack of whole blood for transfusion. Verify the blood type before use.
  components:
  - type: Sprite
    state: bloodpack
  - type: Item
    heldPrefix: bloodpack
  - type: BloodProduct
    productType: WholeBlood
    volume: 500
    bodyFluid: Blood

# --- Whole blood, all eight ABO/Rh types ---

- type: entity
  parent: EclipseBloodProductBase
  id: EclipseBloodPackONeg
  suffix: O-
  components:
  - type: BloodProduct
    productType: WholeBlood
    bloodGroup: O
    rhPositive: false
    bloodType: "O-"

- type: entity
  parent: EclipseBloodProductBase
  id: EclipseBloodPackOPos
  suffix: O+
  components:
