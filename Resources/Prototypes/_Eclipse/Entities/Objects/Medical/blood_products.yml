# --- Universal crystalloids (volume only, no oxygen carriers) ---

- type: entity
  parent: EclipseBloodProductBase
  id: EclipseRingersPack
  name: Ringer's lactate
  description: A universal crystalloid. Restores blood volume and pressure, but carries no oxygen and dilutes the blood.
  components:
  - type: Sprite
    state: bloodpack
    color: "#7fd0e0ff"
  - type: BloodProduct
    productType: Ringers
    volume: 600

- type: entity
  parent: EclipseBloodProductBase
  id: EclipseSalinePack
  name: saline solution
  description: 0.9% sodium chloride. Restores blood volume and pressure, but carries no oxygen and dilutes the blood.
  components:
  - type: Sprite
    state: bloodpack
    color: "#cfe8ffff"
  - type: BloodProduct
    productType: Saline
    volume: 550

