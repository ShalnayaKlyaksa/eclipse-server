# Industrial port configuration tool — the Industrial Key (Промышленный ключ).

- type: tool
  id: IndustrialPortConfiguring
  name: tool-quality-industrial-port-configuring-name
  toolName: tool-quality-industrial-port-configuring-tool-name
  spawn: IndustrialKey
  icon: { sprite: _Eclipse/Objects/Tools/industrial_key.rsi, state: icon }

- type: entity
  parent: BaseItem
  id: IndustrialKey
  name: industrial key
  description: Configures industrial ports and assembles workbenches from tables. Hold it to see port indicators.
  components:
  - type: Sprite
    sprite: _Eclipse/Objects/Tools/industrial_key.rsi
    state: icon
  - type: Item
    sprite: _Eclipse/Objects/Tools/industrial_key.rsi
    storedRotation: -90
  - type: IndustrialConfigurator
  - type: Tool
    qualities:
    - IndustrialPortConfiguring
    useSound:
      path: /Audio/Items/ratchet.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: GuideHelp
    guides: [EclipseIndustrial]
  - type: StaticPrice
    price: 40

# Legacy id alias for existing maps/spawns.
- type: entity
  parent: IndustrialKey
  id: IndustrialPortWrench
  name: industrial key
  suffix: Legacy ID
  categories: [ HideSpawnMenu ]
