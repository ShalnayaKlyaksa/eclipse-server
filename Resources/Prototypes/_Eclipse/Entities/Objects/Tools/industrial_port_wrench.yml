# Industrial port configuration tool — the Industrial Key (Промышленный ключ).

- type: tool
  id: IndustrialPortConfiguring
  name: tool-quality-industrial-port-configuring-name
  toolName: tool-quality-industrial-port-configuring-tool-name
  spawn: IndustrialKey
  icon: { sprite: Objects/Tools/wrench.rsi, state: icon }

- type: tool
  id: IndustrialPipeDetaching
  name: tool-quality-industrial-pipe-detaching-name
  toolName: tool-quality-industrial-pipe-detaching-tool-name
  spawn: IndustrialKey
  icon: { sprite: Objects/Tools/wrench.rsi, state: icon }

- type: entity
  parent: BaseItem
  id: IndustrialKey
  name: industrial key
  description: Configures ports on industrial machines, assembles workbenches from tables, and removes item pipes. Hold it to see port indicators.
  components:
  - type: Sprite
    sprite: Objects/Tools/wrench.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/wrench.rsi
    storedRotation: -90
  - type: IndustrialConfigurator
  - type: Tool
    qualities:
    - IndustrialPortConfiguring
    - IndustrialPipeDetaching
    useSound:
      path: /Audio/Items/ratchet.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: StaticPrice
    price: 40

# Legacy id alias for existing maps/spawns.
- type: entity
  parent: IndustrialKey
  id: IndustrialPortWrench
  name: industrial key
  suffix: Legacy ID
  categories: [ HideSpawnMenu ]
