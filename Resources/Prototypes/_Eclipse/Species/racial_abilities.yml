    useDelay: 22
    icon:
      sprite: _Eclipse/Interface/Actions/species.rsi
      state: scent

  - type: InstantAction
    event: !type:RacialInstantActionEvent
      ability: CanineScent

- type: entity
  parent: BaseAction
