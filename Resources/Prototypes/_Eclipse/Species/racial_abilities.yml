- type: entity
  parent: BaseAction
  id: ActionDwarfBrace
  name: Brace
  description: For seven seconds, take less physical damage while moving more slowly.
  components:
  - type: Action
    useDelay: 40
    icon:
      sprite: _Eclipse/Interface/Actions/species.rsi
      state: brace

  - type: InstantAction
    event: !type:RacialInstantActionEvent
      ability: DwarfBrace

- type: entity
  parent: BaseAction
  id: ActionLavriteVentHeat
  name: Vent heat
  description: Release excess body heat into the surrounding air.
  components:
