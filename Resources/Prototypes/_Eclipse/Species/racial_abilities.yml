  components:
  - type: Action
    useDelay: 10
    icon:
      sprite: _Eclipse/Interface/Actions/species.rsi
      state: pulse

  - type: InstantAction
    event: !type:RacialInstantActionEvent
      ability: ElirReadPulse

- type: entity
  parent: BaseAction
  id: ActionSlimeAdhesive
  name: Sticky spit
  description: Launch a glob of gel that slows the first creature it hits for five seconds.
  components:
  - type: Action
    useDelay: 24
    icon:
      sprite: _Eclipse/Interface/Actions/species.rsi
      state: adhesive
    sound:
      path: /Audio/Voice/Slime/slime_squish.ogg

  - type: TargetAction
    range: 4
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components: [ MobState ]
    event: !type:RacialTargetActionEvent
      ability: SlimeAdhesive

- type: entity
  parent: BaseBullet
  id: SlimefolkStickySpit
  name: sticky gel glob
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/xeno_toxic.rsi
    layers:
    - state: xeno_toxic
  - type: Projectile
    damage: {}
    impactEffect: null
    soundHit:
      path: /Audio/Effects/Fluids/splat.ogg
    forceSound: true
  - type: StickySpitProjectile
  - type: TimedDespawn
    lifetime: 0.42

