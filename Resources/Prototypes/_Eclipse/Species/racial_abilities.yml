    useDelay: 28
    icon:
      sprite: _Eclipse/Interface/Actions/species.rsi
      state: scurry

  - type: InstantAction
    event: !type:RacialInstantActionEvent
      ability: TherianScurry

- type: entity
  parent: BaseAction
  id: ActionShadowVeil
  name: Shadow veil
  description: Fade for up to six seconds. Movement makes you easier to see.
  components:
  - type: Action
    useDelay: 32
    icon:
      sprite: _Eclipse/Interface/Actions/species.rsi
      state: veil

  - type: InstantAction
    event: !type:RacialInstantActionEvent
      ability: ShadowVeil

- type: entity
  parent: BaseAction
  id: ActionSlimeReform
  name: Reform
  description: Spend food to seal a wound and mend some soft tissue.
  components:
  - type: Action
    useDelay: 35
    icon:
      sprite: _Eclipse/Interface/Actions/species.rsi
      state: reform

  - type: InstantAction
    event: !type:RacialInstantActionEvent
      ability: SlimeReform

- type: entity
  parent: BaseAction
  id: ActionMoleiSilk
  name: Silk dressing
  description: Use silk to slow the worst external bleeding on yourself or a nearby patient.
  components:
  - type: Action
    useDelay: 35
    icon:
      sprite: _Eclipse/Interface/Actions/species.rsi
      state: silk

  - type: TargetAction
    range: 1.6
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components: [ AdvancedHealth ]
    event: !type:RacialTargetActionEvent
      ability: MoleiSilk

- type: entity
  parent: BaseAction
  id: ActionLavriteThermalBurst
  name: Thermal burst
  description: Send a wave of heat in a direction, pushing nearby creatures back.
  components:
  - type: Action
    useDelay: 28
    icon:
      sprite: _Eclipse/Interface/Actions/species.rsi
      state: cool

  - type: TargetAction
    range: 0
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:LavriteThermalBurstEvent {}

- type: entity
  id: LavriteHeatPuff
  name: heat puff
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/chempuff.rsi
    state: chempuff
    color: "#FFA04D80"
  - type: TimedDespawn
    lifetime: 0.35

- type: entity
  parent: BaseAction
  id: ActionSaurianTailSweep
  name: Tail sweep
  description: Click in a direction to sweep your tail and drain a nearby target's stamina.
  components:
  - type: Action
    useDelay: 22
    icon:
      sprite: _Eclipse/Interface/Actions/species.rsi
      state: sweep

  - type: TargetAction
    range: 0
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:SaurianTailSweepEvent {}

- type: entity
  parent: BaseAction
  id: ActionElirReadPulse
  name: Read pulse
