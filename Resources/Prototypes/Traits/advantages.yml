# Advantage traits spend points gained from disadvantage traits.

- type: trait
  id: Endurance
  name: trait-endurance-name
  description: trait-endurance-desc
  category: Advantages
  cost: -2
  specials:
  - !type:ApplyStatusEffectSpecial
    statusEffects: [TraitStatusEffectEndurance]

- type: trait
  id: StrongBody
  name: trait-strong-body-name
  description: trait-strong-body-desc
  category: Advantages
  cost: -3
